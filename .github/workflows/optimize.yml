name: Global AI Parameter Optimizer

on:
  schedule:
    - cron: '0 * * * *'   # Runs on the hour, 24 times a day
  workflow_dispatch:      # Allows manual trigger in GitHub UI!

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas ccxt

      - name: Run Global Optimization
        run: |
          python optimize_global.py

      - name: Rebase on latest main
        run: |
          git pull --rebase --autostash origin main

      - name: Commit and Push optimized parameters
        run: |
          git config --global user.name "AI Master Optimizer"
          git config --global user.email "actions@github.com"
          shopt -s nullglob
          journal_files=(journal_*.json)
          git add global_optimizer.json
          if [ ${#journal_files[@]} -gt 0 ]; then
            git add "${journal_files[@]}"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "AI Master: Global DNA updated"
            git push origin main
          fi
